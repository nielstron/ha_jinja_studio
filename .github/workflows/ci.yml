name: Validate
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.13'
      - run: uv sync --group dev
      - run: npm ci
      - run: npm test
      - run: uv run --group dev python -m pytest tests/test_filter_catalog.py
      - run: npm run build
      - run: git diff --exit-code -- custom_components/jinja_studio/frontend
      - run: uv run --group dev ruff check custom_components dev
      - run: uv run --group dev ruff format --check custom_components dev
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master
  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
